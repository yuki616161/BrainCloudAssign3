<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Cloud - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/login.css?v=1.1" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            color: white;
        }
        .container {
            text-align: center;
        }
        .container h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .container p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .start-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            background-color: #ffffff;
            color: #2193b0;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .start-btn:hover {
            background-color: #2193b0;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Brain Cloud</h1>
        <p>Your personal cloud-based solution.</p>
        <button class="start-btn" onclick="navigateToLogin()">Start</button>
    </div>

    <script>
        function navigateToLogin() {
            window.location.href = "login.html"; // Redirect to the login page
        }
    </script>
</body>
</html>
