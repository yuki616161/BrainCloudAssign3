<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-container">
        <h1>Register</h1>

        <!-- Display any error message -->
        <div id="error-message" class="error"></div>

        <!-- Registration form -->
        <form id="registerForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="birthday">Birthday:</label>
            <input type="date" id="birthday" name="birthday" required>

            <label for="security_question">Security Question:</label>
            <input type="text" id="security_question" name="security_question" value="What is your mother's name?" readonly>

            <label for="security_answer">Answer:</label>
            <input type="text" id="security_answer" name="security_answer" placeholder="Enter your answer" required>

            <button type="submit">Register</button>

            <div id="message-container" style="margin-top: 10px;"></div>

        </form>

        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
